workflows:
  ios-unsigned-ipa:
    name: MT File Manager - unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project MTFileManager.xcodeproj \
            -scheme MTFileManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MTFileManager.app Payload/
          mkdir -p artifacts
          /usr/bin/zip -r artifacts/MTFileManager-unsigned.ipa Payload
    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
